<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSH Educational Materials</title>
<style>
:root{--p:#0b5a72;--p2:#083f52;--bg:#f3f6f8;--card:#fff;--line:#d8e2e7;--txt:#173042;--muted:#667984;--soft:#eef4f6;--accent:#b87409}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.65}
a{color:inherit}button,input,select{font:inherit}
.hero{background:radial-gradient(circle at 88% 12%,#d7972438,transparent 27%),linear-gradient(135deg,#073f51,#0b5a72 58%,#19738c);color:#fff;padding:12px 20px 18px}
.inner{width:min(1180px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.brand{font-size:.68rem;font-weight:850;letter-spacing:.08em}
.admin{border:1px solid #ffffff55;border-radius:8px;padding:5px 9px;text-decoration:none;background:#ffffff14;font-weight:800;font-size:.68rem}
h1{font-size:clamp(1.15rem,2.2vw,1.75rem);line-height:1.2;margin:1px 0 4px;font-weight:850}.hero p{max-width:960px;margin:0;color:#ffffffdf;font-size:.84rem;line-height:1.4}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.stat{min-width:105px;border:1px solid #ffffff35;background:#ffffff11;border-radius:8px;padding:5px 8px}.stat small{display:block;opacity:.75;font-size:.6rem}.stat strong{font-size:.9rem}
main{padding:30px 0 68px}.intro{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 26px #1833440d}.intro h2{margin:0 0 6px}.intro p{margin:0;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.controls input,.controls select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}.controls input{flex:1 1 320px}.controls select{min-width:190px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:18px 0 12px}.heading h2{margin:0}.heading span{font-size:.82rem;color:var(--muted)}
.packages{display:grid;gap:22px}.package{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 34px #17324310;overflow:hidden}
.package-head{padding:23px 24px 18px;background:linear-gradient(180deg,#fff,#fbfcfd)}.package-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.package h3{font-size:1.48rem;margin:4px 0 7px;line-height:1.35}.package-desc{margin:0;color:var(--muted);max-width:850px}.package-stats{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.pstat{background:var(--soft);border-radius:999px;padding:5px 9px;font-size:.72rem;color:var(--p2);font-weight:800}
.resources{border-top:1px solid var(--line);padding:17px 18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:#f8fafb}
.resource{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.resource-body{padding:16px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px 8px;font-size:.68rem;font-weight:850;color:var(--p2)}
.resource h4{font-size:1rem;margin:0 0 7px}.resource p{font-size:.84rem;color:var(--muted);margin:0 0 10px}.filename{font-size:.74rem;color:var(--muted);word-break:break-all}
.resource-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 12px}.counts{display:flex;gap:9px;color:var(--muted);font-size:.72rem;white-space:nowrap}.actionset{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:7px 10px;font-weight:800;font-size:.77rem;text-decoration:none;cursor:pointer}.btn.primary{background:var(--p);color:#fff}.btn.preview{background:#e8f0f3;color:var(--p2);border:1px solid #d7e2e7}
.preview-frame{display:none;width:100%;border:0;border-top:1px solid var(--line);background:#fff}.preview-frame.open{display:block}
.standalone-label{display:inline-flex;background:#fff3df;color:#835207;border-radius:999px;padding:3px 8px;font-size:.68rem;font-weight:800}
.empty,.error{padding:34px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.error{color:#923f3f;border-color:#e3bcbc}
footer{border-top:1px solid var(--line);background:#fff;padding:24px 20px;color:var(--muted);font-size:.8rem}
@media(max-width:820px){.resources{grid-template-columns:1fr}.package-top{flex-direction:column}.package-stats{justify-content:flex-start}}
@media(max-width:560px){.inner{width:min(1180px,calc(100% - 20px))}.resource-actions{align-items:stretch;flex-direction:column}.actionset{justify-content:stretch}.actionset .btn{flex:1}.counts{justify-content:space-between;width:100%}}
</style>
</head>
<body>
<header class="hero"><div class="inner">
 <div class="top"><div class="brand">SSH EDUCATIONAL MATERIALS</div><a id="adminLink" class="admin" href="#" target="_blank" rel="noopener">Admin</a></div>
 <h1 id="siteTitle">静岡北中学校・高等学校　SSH開発教材・支援資料　普及サイト</h1>
 <p id="siteSubtitle">SSHの活動を通して開発した教材・研究支援ツール・プログラムを公開します。</p>
 <div class="stats"><div class="stat"><small>サイト閲覧数</small><strong id="siteViews">—</strong></div><div class="stat"><small>公開パッケージ</small><strong id="packageCount">—</strong></div><div class="stat"><small>公開資料</small><strong id="materialCount">—</strong></div></div>
</div></header>
<main class="inner">
 <section class="intro"><h2 id="introTitle">公開資料について</h2><p id="introText">本校では探究活動として課題研究などを実施しています。授業実施のために開発した教材や支援資料をダウンロード・閲覧ができます。</p></section>
 <div class="controls"><input id="searchInput" type="search" placeholder="パッケージ名・資料名・説明・キーワードで検索"><select id="typeFilter"><option value="">すべての種別</option></select></div>
 <div class="heading"><h2>公開パッケージ</h2><span id="summary">読み込み中</span></div>
 <section id="packages" class="packages"><div class="empty">資料情報を読み込んでいます。</div></section>
</main>
<footer><div class="inner"><span id="footerText">Shizuoka Kita SSH Educational Materials</span></div></footer>
<script>
const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbwq_w2GxPfrwuzjhAEXj9SkKp3kur1JMAZexrD_MjIx1tg2NUAX1YkoR9OHlv7OKex1fw/exec';
const state={packages:[],materials:[],stats:{siteViews:0,materials:{}},settings:{},q:'',type:''};
const el=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const num=v=>Number(v||0).toLocaleString('ja-JP');
const PUBLIC_COUNT_THRESHOLD=10;
function countChip(label,value){
 const n=Number(value||0);
 return n>=PUBLIC_COUNT_THRESHOLD?`<span>${label} ${num(n)}</span>`:'';
}
function logEvent(event,m){
 const p=new URLSearchParams({event,material_id:m?.id||'',title:m?.title||'',file_name:m?.fileName||'',page_url:location.href,referrer:document.referrer||''});
 fetch(`${GAS_WEB_APP_URL}?${p}`,{mode:'no-cors',cache:'no-store',keepalive:true}).catch(()=>{});
}
function applySettings(){
 const s=state.settings||{};
 document.title=s.siteTitle||'静岡北中学校・高等学校　SSH開発教材・支援資料　普及サイト';
 el('siteTitle').textContent=s.siteTitle||'静岡北中学校・高等学校　SSH開発教材・支援資料　普及サイト';
 el('siteSubtitle').textContent=s.siteSubtitle||'SSHの活動を通して開発した教材・研究支援ツール・プログラムを公開します。';
 el('introTitle').textContent=s.introTitle||'公開資料について';
 el('introText').textContent=s.introText||'本校では探究活動として課題研究などを実施しています。授業実施のために開発した教材や支援資料をダウンロード・閲覧ができます。';
 el('footerText').textContent=s.footerText||'Shizuoka Kita SSH Educational Materials';
 el('siteViews').textContent=num(state.stats?.siteViews||0);
 el('packageCount').textContent=num(state.packages.length);
 el('materialCount').textContent=num(state.materials.length);
 el('adminLink').href=`${GAS_WEB_APP_URL}?page=admin`;
}
function buildTypes(){
 const types=[...new Set(state.materials.map(m=>m.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
 el('typeFilter').innerHTML='<option value="">すべての種別</option>'+types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
}
function resourceMatches(m,p,q,type){
 if(type&&m.type!==type)return false;
 if(!q)return true;
 return [p.title,p.description,p.keywords,m.title,m.description,m.keywords,m.fileName,m.type].join(' ').toLowerCase().includes(q);
}
function visiblePackages(){
 const q=state.q.trim().toLowerCase(),type=state.type;
 return state.packages.map(p=>{
  const children=state.materials.filter(m=>m.packageId===p.id&&resourceMatches(m,p,q,type));
  const packageText=[p.title,p.description,p.keywords].join(' ').toLowerCase();
  const packageHit=!q||packageText.includes(q);
  const allChildren=state.materials.filter(m=>m.packageId===p.id);
  return {...p,children:(packageHit&&!type)?allChildren:children};
 }).filter(p=>p.children.length>0);
}
function render(){
 const list=visiblePackages();
 el('summary').textContent=`${list.length}パッケージ / ${state.materials.length}資料`;
 if(!list.length){el('packages').innerHTML='<div class="empty">条件に一致するパッケージはありません。</div>';return}
 const statMap=state.stats?.materials||{};
 el('packages').innerHTML=list.map(p=>{
   const totals=p.children.reduce((a,m)=>{const s=statMap[m.id]||{};a.views+=Number(s.views||0);a.downloads+=Number(s.downloads||0);a.opens+=Number(s.opens||0);return a},{views:0,downloads:0,opens:0});
   return `<article class="package">
    <div class="package-head"><div class="package-top"><div><div class="standalone-label">PACKAGE</div><h3>${esc(p.title)}</h3><p class="package-desc">${esc(p.description||'')}</p></div>
    <div class="package-stats"><span class="pstat">${p.children.length}資料</span>${totals.views>=PUBLIC_COUNT_THRESHOLD?`<span class="pstat">閲覧 ${num(totals.views)}</span>`:''}${totals.downloads>=PUBLIC_COUNT_THRESHOLD?`<span class="pstat">DL ${num(totals.downloads)}</span>`:''}</div></div></div>
    <div class="resources">${p.children.map(m=>resourceHtml(m,statMap[m.id]||{})).join('')}</div>
   </article>`;
 }).join('');
 bind();
 observe();
}
function resourceHtml(m,s){
 const pv=m.previewEnabled&&m.previewUrl;
 const countHtml=[
   countChip('閲覧',s.views),
   countChip('Preview',s.previewViews),
   countChip('DL',s.downloads)
 ].filter(Boolean).join('');
 return `<section class="resource" data-material="${esc(m.id)}"><div class="resource-body">
   <div class="badges"><span class="badge">${esc(m.type)}</span>${m.sourceKind==='drive'?'<span class="badge">Google Drive</span>':''}</div>
   <h4>${esc(m.title)}</h4><p>${esc(m.description||'')}</p>${m.fileName?`<div class="filename">${esc(m.fileName)}</div>`:''}
  </div>
  ${pv?`<iframe class="preview-frame" data-frame="${esc(m.id)}" data-src="${esc(m.previewUrl)}" height="${Number(m.previewHeight||520)}" loading="lazy" allow="fullscreen"></iframe>`:''}
  <div class="resource-actions">${countHtml?`<div class="counts">${countHtml}</div>`:'<div></div>'}
   <div class="actionset">${pv?`<button class="btn preview" data-preview="${esc(m.id)}">プレビュー</button>`:''}${m.actionUrl?`<a class="btn primary" data-action="${esc(m.id)}" href="${esc(m.actionUrl)}" target="_blank" rel="noopener">${esc(m.actionLabel||'開く')}</a>`:''}</div></div>
  </section>`;
}
function bind(){
 document.querySelectorAll('[data-preview]').forEach(b=>b.addEventListener('click',()=>{
   const id=b.dataset.preview,f=document.querySelector(`[data-frame="${CSS.escape(id)}"]`),m=state.materials.find(x=>x.id===id);
   if(!f||!m)return;
   const open=!f.classList.contains('open');
   if(open){if(!f.src)f.src=f.dataset.src;f.classList.add('open');b.textContent='プレビューを閉じる';const k='preview:'+id;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');logEvent('preview_open',m)}}
   else{f.classList.remove('open');b.textContent='プレビュー'}
 }));
 document.querySelectorAll('[data-action]').forEach(a=>a.addEventListener('click',()=>{
   const m=state.materials.find(x=>x.id===a.dataset.action);if(m)logEvent(m.actionMode==='download'?'download':'open',m);
 }));
}
let obs;
function observe(){
 if(!('IntersectionObserver'in window))return;if(obs)obs.disconnect();
 obs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting||e.intersectionRatio<.45)return;const id=e.target.dataset.material,m=state.materials.find(x=>x.id===id),k='view:'+id;if(m&&!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');logEvent('material_view',m)}obs.unobserve(e.target)}),{threshold:[.45]});
 document.querySelectorAll('[data-material]').forEach(x=>obs.observe(x));
}
function load(){
 const cb='ssh_'+Date.now()+'_'+Math.floor(Math.random()*1e5),s=document.createElement('script');
 window[cb]=p=>{try{if(!p||p.ok===false)throw new Error(p?.error||'GASからデータを取得できません。');state.packages=Array.isArray(p.packages)?p.packages:[];state.materials=Array.isArray(p.materials)?p.materials:[];state.stats=p.stats||state.stats;state.settings=p.settings||{};applySettings();buildTypes();render()}catch(e){el('packages').innerHTML='<div class="error">GASエラー: '+esc(e.message)+'</div>'}finally{delete window[cb];s.remove()}};
 s.onerror=()=>{el('packages').innerHTML='<div class="error">GASから資料情報を取得できません。</div>';delete window[cb];s.remove()};
 s.src=`${GAS_WEB_APP_URL}?mode=public_data&callback=${cb}&_=${Date.now()}`;document.head.appendChild(s);
}
document.addEventListener('DOMContentLoaded',()=>{
 el('searchInput').addEventListener('input',e=>{state.q=e.target.value;render()});
 el('typeFilter').addEventListener('change',e=>{state.type=e.target.value;render()});
 applySettings();logEvent('page_view',null);load();
});
</script>
</body></html>
