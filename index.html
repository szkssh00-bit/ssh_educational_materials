<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SSHで開発した教育・研究支援資料を公開する資料ポータルです。">
  <title>SSH Educational Materials</title>
  <style>
    :root {
      --bg: #f5f8fb;
      --surface: #ffffff;
      --surface-2: #eef4f8;
      --text: #173042;
      --muted: #627785;
      --line: #d7e2e9;
      --primary: #0d5c75;
      --primary-2: #0a4960;
      --accent: #d98c10;
      --success: #2a7b5f;
      --shadow: 0 10px 30px rgba(31, 57, 74, 0.08);
      --radius: 18px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                   "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
    }

    a { color: inherit; }

    .hero {
      background:
        radial-gradient(circle at 85% 20%, rgba(217, 140, 16, 0.18), transparent 26%),
        linear-gradient(135deg, #0a4960 0%, #0d5c75 52%, #17738f 100%);
      color: #fff;
      padding: 72px 24px 54px;
    }

    .hero-inner,
    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .hero p {
      max-width: 760px;
      margin: 12px 0 0;
      color: rgba(255,255,255,0.9);
      font-size: 1.02rem;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      min-width: 150px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(8px);
    }

    .stat-label {
      display: block;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.75);
    }

    .stat-value {
      display: block;
      margin-top: 2px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    main { padding: 34px 0 70px; }

    .intro {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .panel h2,
    .section-head h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    .panel p {
      margin: 8px 0;
      color: var(--muted);
    }

    .mini-note {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin: 24px 0;
    }

    .search {
      flex: 1 1 300px;
      min-width: 0;
      position: relative;
    }

    .search input,
    .controls select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      outline: none;
    }

    .search input:focus,
    .controls select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 92, 117, 0.12);
    }

    .controls select {
      width: auto;
      min-width: 180px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin: 20px 0 14px;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .materials {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 330px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(31, 57, 74, 0.12);
    }

    .card-top {
      padding: 22px 22px 16px;
      flex: 1;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--primary-2);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .badge.accent {
      background: #fff4df;
      color: #8b5600;
    }

    .card h3 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.45;
    }

    .card .desc {
      margin: 12px 0 16px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .meta {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 4px 10px;
      margin-top: 14px;
      font-size: 0.84rem;
    }

    .meta dt {
      color: var(--muted);
    }

    .meta dd {
      margin: 0;
      word-break: break-word;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 22px 18px;
      border-top: 1px solid var(--line);
      background: #fbfdfe;
    }

    .counts {
      display: flex;
      gap: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.16s ease;
    }

    .download-btn:hover { background: var(--primary-2); }

    .empty {
      grid-column: 1 / -1;
      padding: 36px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      text-align: center;
      color: var(--muted);
      background: var(--surface);
    }

    footer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 26px 24px 34px;
      font-size: 0.85rem;
    }

    footer .container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #a0adb6;
    }

    .status-dot.ok { background: var(--success); }

    @media (max-width: 800px) {
      .hero { padding-top: 52px; }
      .intro { grid-template-columns: 1fr; }
      .materials { grid-template-columns: 1fr; }
      .card-bottom { align-items: flex-end; }
    }

    @media (max-width: 520px) {
      .hero-inner,
      .container { width: min(100% - 24px, var(--max)); }
      .panel { padding: 18px; }
      .card-top { padding: 18px 18px 14px; }
      .card-bottom {
        padding: 14px 18px 18px;
        flex-direction: column;
        align-items: stretch;
      }
      .counts { justify-content: space-between; }
      .download-btn { width: 100%; }
      .controls select { width: 100%; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">SSH EDUCATIONAL MATERIALS</div>
      <h1>教育・研究支援資料</h1>
      <p>
        SSHの活動を通して開発した教材、実験支援ツール、プログラム、資料を公開します。
        各資料は説明を確認したうえでダウンロードできます。
      </p>

      <div class="hero-stats" aria-label="利用状況">
        <div class="stat">
          <span class="stat-label">サイト閲覧数</span>
          <span class="stat-value" id="siteViews">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">公開資料数</span>
          <span class="stat-value" id="materialCount">—</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <div class="panel">
        <h2>このサイトについて</h2>
        <p>
          SSHで開発した教育・研究支援資料を、再利用しやすい形で蓄積・公開するための資料ポータルです。
          プログラム、PDF、授業・研究支援資料などを順次追加します。
        </p>
        <p class="mini-note">
        </p>
      </div>

      <div class="panel">
       
      </div>
    </section>

    <div class="controls">
      <label class="search">
        <span style="position:absolute;left:-9999px;">資料検索</span>
        <input id="searchInput" type="search" placeholder="資料名・説明・キーワードで検索">
      </label>

      <label>
        <span style="position:absolute;left:-9999px;">カテゴリ</span>
        <select id="categoryFilter">
          <option value="">すべてのカテゴリ</option>
        </select>
      </label>
    </div>

    <div class="section-head">
      <div>
        <h2>公開資料</h2>
        <p id="resultSummary">資料を読み込んでいます。</p>
      </div>
    </div>

    <section id="materials" class="materials" aria-live="polite"></section>
  </main>

  <footer>
    <div class="container">
      <span>SSH Educational Materials</span>
    </div>
  </footer>

  <script>
    /*
     * ============================================================
     * 1. GAS WebアプリURL
     * ============================================================
     * gas/Code.gs をGASに設置して「ウェブアプリ」としてデプロイ後、
     * 発行された /exec のURLに置き換えてください。
     */
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwq_w2GxPfrwuzjhAEXj9SkKp3kur1JMAZexrD_MjIx1tg2NUAX1YkoR9OHlv7OKex1fw/exec';

    /*
     * ============================================================
     * 2. 公開資料
     * ============================================================
     * Google Driveファイルの場合:
     *   driveFileId: '1AbCdEf...'
     * とすると、
     *   https://drive.google.com/uc?export=download&id=...
     * の形式を自動生成します。
     *
     * GitHub Pages内に置くファイルの場合:
     *   driveFileId: '',
     *   downloadUrl: 'assets/files/ファイル名.ext'
     * としてください。
     */
    const MATERIALS = [
      {
        id: 'tool-lending-return-fix-20260820',
        title: '実験ツール貸出管理システム（返却処理修正版）',
        category: '校務・研究支援',
        type: 'JavaScript / Google Apps Script',
        fileName: '実験ツール貸出管理_返却修正版.js',
        description:
          'GoogleフォームとGoogleスプレッドシートを連携し、実験ツールの貸出・返却を一元管理するスクリプトです。' +
          '「01_管理台帳」を正本として1行1個体で管理します。返却処理では、返却候補の先頭に貸出IDを表示し、' +
          '正規表現で貸出IDを厳密に取得するよう修正しています。また、既存フォームの貸出・返却ページ遷移を修復する処理も含みます。',
        keywords: ['GAS', 'Google Forms', 'Google Sheets', '貸出管理', '返却処理', '実験ツール'],
        driveFileId: '',
        downloadUrl: 'assets/files/%E5%AE%9F%E9%A8%93%E3%83%84%E3%83%BC%E3%83%AB%E8%B2%B8%E5%87%BA%E7%AE%A1%E7%90%86_%E8%BF%94%E5%8D%B4%E4%BF%AE%E6%AD%A3%E7%89%88.js'
      }

      /*
       * 追加例：Google Drive上のPDF
       *
       * ,{
       *   id: 'sample-pdf-001',
       *   title: '資料タイトル',
       *   category: '教材',
       *   type: 'PDF',
       *   version: '2026-08-20',
       *   fileName: 'sample.pdf',
       *   description: '資料の説明。',
       *   keywords: ['化学', '実験'],
       *   driveFileId: 'GOOGLE_DRIVE_FILE_ID',
       *   downloadUrl: ''
       * }
       */
    ];

    const state = {
      stats: {
        pageViews: 0,
        materialViews: {},
        downloads: {}
      },
      query: '',
      category: ''
    };

    function isGasConfigured() {
      return GAS_WEB_APP_URL &&
             GAS_WEB_APP_URL.includes('/macros/s/') &&
             !GAS_WEB_APP_URL.includes('PASTE_DEPLOYMENT_ID');
    }

    function driveDownloadUrl(fileId) {
      return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(fileId)}`;
    }

    function getDownloadUrl(material) {
      if (material.driveFileId) {
        return driveDownloadUrl(material.driveFileId);
      }
      return material.downloadUrl || '#';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatCount(value) {
      const n = Number(value || 0);
      return n.toLocaleString('ja-JP');
    }

    function buildCategories() {
      const select = document.getElementById('categoryFilter');
      const categories = [...new Set(MATERIALS.map(m => m.category).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'ja'));

      for (const category of categories) {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      }
    }

    function matches(material) {
      const q = state.query.trim().toLowerCase();
      const categoryOK = !state.category || material.category === state.category;

      if (!categoryOK) return false;
      if (!q) return true;

      const haystack = [
        material.title,
        material.description,
        material.category,
        material.type,
        material.fileName,
        ...(material.keywords || [])
      ].join(' ').toLowerCase();

      return haystack.includes(q);
    }

    function renderMaterials() {
      const root = document.getElementById('materials');
      const list = MATERIALS.filter(matches);

      document.getElementById('materialCount').textContent = formatCount(MATERIALS.length);
      document.getElementById('resultSummary').textContent =
        `${list.length}件 / 全${MATERIALS.length}件`;

      if (!list.length) {
        root.innerHTML = '<div class="empty">条件に一致する資料はありません。</div>';
        return;
      }

      root.innerHTML = list.map(material => {
        const views = state.stats.materialViews[material.id] || 0;
        const downloads = state.stats.downloads[material.id] || 0;
        const url = getDownloadUrl(material);

        return `
          <article class="card" data-material-id="${escapeHtml(material.id)}">
            <div class="card-top">
              <div class="badges">
                <span class="badge">${escapeHtml(material.category)}</span>
                <span class="badge">${escapeHtml(material.type)}</span>
                <span class="badge accent">更新 ${escapeHtml(material.version)}</span>
              </div>

              <h3>${escapeHtml(material.title)}</h3>
              <p class="desc">${escapeHtml(material.description)}</p>

              <dl class="meta">
                <dt>ファイル</dt>
                <dd>${escapeHtml(material.fileName)}</dd>
                <dt>キーワード</dt>
                <dd>${escapeHtml((material.keywords || []).join(' / '))}</dd>
              </dl>
            </div>

            <div class="card-bottom">
              <div class="counts" aria-label="資料利用数">
                <span>閲覧 ${formatCount(views)}</span>
                <span>DL ${formatCount(downloads)}</span>
              </div>

              <a class="download-btn"
                 href="${escapeHtml(url)}"
                 target="_blank"
                 rel="noopener noreferrer"
                 data-download-id="${escapeHtml(material.id)}">
                ダウンロード
              </a>
            </div>
          </article>
        `;
      }).join('');

      bindDownloadEvents();
      observeMaterialViews();
    }

    function logEvent(eventName, material = null) {
      if (!isGasConfigured()) return;

      const params = new URLSearchParams({
        event: eventName,
        material_id: material?.id || '',
        title: material?.title || '',
        file_name: material?.fileName || '',
        page_url: location.href,
        referrer: document.referrer || ''
      });

      fetch(`${GAS_WEB_APP_URL}?${params.toString()}`, {
        method: 'GET',
        mode: 'no-cors',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    }

    function bindDownloadEvents() {
      document.querySelectorAll('[data-download-id]').forEach(link => {
        link.addEventListener('click', () => {
          const material = MATERIALS.find(m => m.id === link.dataset.downloadId);
          if (!material) return;

          logEvent('download', material);

          state.stats.downloads[material.id] =
            (state.stats.downloads[material.id] || 0) + 1;

          renderCountsOnly();
        });
      });
    }

    let observer = null;

    function observeMaterialViews() {
      if (!('IntersectionObserver' in window)) return;

      if (observer) observer.disconnect();

      observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting || entry.intersectionRatio < 0.5) return;

          const card = entry.target;
          const id = card.dataset.materialId;
          const material = MATERIALS.find(m => m.id === id);
          if (!material) return;

          const key = `ssh-material-viewed:${id}`;

          // 同一タブの同一閲覧中に、同じ資料を何度も加算しない。
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            logEvent('material_view', material);

            state.stats.materialViews[id] =
              (state.stats.materialViews[id] || 0) + 1;

            renderCountsOnly();
          }

          observer.unobserve(card);
        });
      }, { threshold: [0.5] });

      document.querySelectorAll('.card[data-material-id]').forEach(card => {
        observer.observe(card);
      });
    }

    function renderCountsOnly() {
      document.getElementById('siteViews').textContent =
        isGasConfigured() ? formatCount(state.stats.pageViews) : '—';

      document.querySelectorAll('.card[data-material-id]').forEach(card => {
        const id = card.dataset.materialId;
        const counts = card.querySelector('.counts');
        if (!counts) return;

        counts.innerHTML = `
          <span>閲覧 ${formatCount(state.stats.materialViews[id] || 0)}</span>
          <span>DL ${formatCount(state.stats.downloads[id] || 0)}</span>
        `;
      });
    }

    function loadStats() {
      const status = document.getElementById('analyticsStatus');
      const dot = status.querySelector('.status-dot');

      if (!isGasConfigured()) {
        status.lastChild.textContent = ' GAS WebアプリURL未設定';
        return;
      }

      const callbackName = `sshStats_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

      window[callbackName] = function(payload) {
        try {
          state.stats = {
            pageViews: Number(payload.pageViews || 0),
            materialViews: payload.materialViews || {},
            downloads: payload.downloads || {}
          };

          renderCountsOnly();
          dot.classList.add('ok');
          status.lastChild.textContent = ' GAS集計接続済み';
        } finally {
          delete window[callbackName];
          script.remove();
        }
      };

      const script = document.createElement('script');
      script.src =
        `${GAS_WEB_APP_URL}?mode=stats&callback=${encodeURIComponent(callbackName)}&_=${Date.now()}`;

      script.onerror = () => {
        status.lastChild.textContent = ' GAS集計への接続を確認してください';
        delete window[callbackName];
        script.remove();
      };

      document.head.appendChild(script);
    }

    document.getElementById('searchInput').addEventListener('input', event => {
      state.query = event.target.value;
      renderMaterials();
    });

    document.getElementById('categoryFilter').addEventListener('change', event => {
      state.category = event.target.value;
      renderMaterials();
    });

    buildCategories();
    renderMaterials();

    // ページ全体の閲覧数
    logEvent('page_view');

    // GAS側の累積値を取得
    loadStats();
  </script>
</body>
</html>
