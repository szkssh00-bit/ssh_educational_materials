<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSH Educational Materials</title>
<style>
:root{--p:#0b5a72;--p2:#08475b;--bg:#f4f7f9;--card:#fff;--line:#d7e1e7;--txt:#173042;--muted:#667984}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.65}
a{color:inherit}.hero{background:linear-gradient(135deg,#08475b,#0b5a72 55%,#18728c);color:#fff;padding:26px 20px 50px}
.inner{width:min(1160px,calc(100% - 30px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}
.brand{font-size:.85rem;font-weight:800;letter-spacing:.08em}.admin{border:1px solid #ffffff55;border-radius:10px;padding:8px 14px;text-decoration:none;background:#ffffff15;font-weight:800;font-size:.82rem}
h1{font-size:clamp(2rem,5vw,3.8rem);margin:10px 0;line-height:1.1}.hero p{max-width:780px;color:#ffffffe8}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.stat{border:1px solid #ffffff33;background:#ffffff12;border-radius:12px;padding:10px 15px;min-width:145px}.stat small{display:block;opacity:.75}.stat strong{font-size:1.2rem}
main{padding:30px 0 65px}.about,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #1b35460d}
.about{padding:20px;margin-bottom:20px}.about h2{margin:0 0 7px}.about p{color:var(--muted);margin:5px 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.controls input{flex:1 1 300px}.controls select{min-width:180px}
.head{display:flex;justify-content:space-between;align-items:end;margin:17px 0 11px}.head h2{margin:0}.head span{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{overflow:hidden}.body{padding:20px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.badge{background:#edf3f6;color:var(--p2);border-radius:999px;padding:3px 8px;font-size:.72rem;font-weight:800}
.card h3{margin:0;font-size:1.18rem}.desc{color:var(--muted);font-size:.92rem}.meta{font-size:.8rem;color:var(--muted)}
.previewbar,.foot{border-top:1px solid var(--line);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.previewbar{background:#f7fafb}
button,.btn{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:800}.previewbtn{border:1px solid var(--line);background:#fff;color:var(--p2);font-size:.8rem}
iframe.preview{display:none;width:100%;border:0;border-top:1px solid var(--line);background:#fff}.preview.open{display:block}
.counts{display:flex;gap:12px;font-size:.79rem;color:var(--muted)}.btn{background:var(--p);color:#fff;text-decoration:none;font-size:.84rem}.btn:hover{background:var(--p2)}
.empty,.error{grid-column:1/-1;padding:32px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:#fff;color:var(--muted)}.error{color:#8c3d3d;border-color:#e3bcbc}
footer{background:#fff;border-top:1px solid var(--line);padding:24px 20px;color:var(--muted);font-size:.82rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}.foot{flex-direction:column;align-items:stretch}.btn{text-align:center}.counts{justify-content:space-between}}
</style>
</head>
<body>
<header class="hero">
 <div class="inner">
  <div class="top"><div class="brand">SSH EDUCATIONAL MATERIALS</div><a id="adminLink" class="admin" href="#" target="_blank">Admin</a></div>
  <h1 id="siteTitle">教育・研究支援資料</h1>
  <p id="siteSubtitle">SSHの活動を通して開発した教材・研究支援ツール・プログラムを公開します。</p>
  <div class="stats"><div class="stat"><small>サイト閲覧数</small><strong id="siteViews">—</strong></div><div class="stat"><small>公開資料数</small><strong id="materialCount">—</strong></div></div>
 </div>
</header>
<main class="inner">
 <section class="about"><h2 id="introTitle">公開資料について</h2><p id="introText">説明を確認し、プレビューまたはダウンロード・閲覧ができます。</p></section>
 <div class="controls"><input id="q" type="search" placeholder="資料名・説明・キーワードで検索"><select id="type"><option value="">すべての種別</option></select></div>
 <div class="head"><h2>公開資料</h2><span id="summary">読み込み中</span></div>
 <section id="grid" class="grid"><div class="empty">資料情報を読み込んでいます。</div></section>
</main>
<footer><div class="inner"><span id="footerText">SSH Educational Materials</span></div></footer>
<script>
const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbwq_w2GxPfrwuzjhAEXj9SkKp3kur1JMAZexrD_MjIx1tg2NUAX1YkoR9OHlv7OKex1fw/exec';
const state={materials:[],stats:{materials:{},siteViews:0},settings:{},q:'',type:''};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const num=v=>Number(v||0).toLocaleString('ja-JP');
function configured(){return GAS_WEB_APP_URL.includes('/macros/s/')&&!GAS_WEB_APP_URL.includes('PASTE_DEPLOYMENT_ID')}
function logEvent(event,m){
 if(!configured())return;
 const p=new URLSearchParams({event,material_id:m?.id||'',title:m?.title||'',file_name:m?.fileName||'',page_url:location.href,referrer:document.referrer||''});
 fetch(`${GAS_WEB_APP_URL}?${p}`,{mode:'no-cors',cache:'no-store',keepalive:true}).catch(()=>{});
}
function apply(){
 const s=state.settings||{};
 document.title=s.siteTitle||'SSH Educational Materials';
 siteTitle.textContent=s.siteTitle||'教育・研究支援資料';siteSubtitle.textContent=s.siteSubtitle||'';
 introTitle.textContent=s.introTitle||'公開資料について';introText.textContent=s.introText||'';
 footerText.textContent=s.footerText||'SSH Educational Materials';
 siteViews.textContent=num(state.stats.siteViews);materialCount.textContent=num(state.materials.length);
 adminLink.href=configured()?`${GAS_WEB_APP_URL}?page=admin`:'#';
}
function types(){
 const a=[...new Set(state.materials.map(x=>x.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
 type.innerHTML='<option value="">すべての種別</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('');
}
function match(m){
 if(state.type&&m.type!==state.type)return false;
 const x=state.q.trim().toLowerCase();if(!x)return true;
 return [m.title,m.description,m.keywords,m.fileName,m.type].join(' ').toLowerCase().includes(x);
}
function render(){
 const list=state.materials.filter(match);summary.textContent=`${list.length}件 / 全${state.materials.length}件`;
 if(!list.length){grid.innerHTML='<div class="empty">条件に一致する資料はありません。</div>';return}
 grid.innerHTML=list.map(m=>{
  const s=state.stats.materials[m.id]||{};const pv=m.previewEnabled&&m.previewUrl;
  return `<article class="card" data-id="${esc(m.id)}"><div class="body">
   <div class="badges"><span class="badge">${esc(m.type)}</span>${m.sourceKind==='drive'?'<span class="badge">Google Drive</span>':''}</div>
   <h3>${esc(m.title)}</h3><p class="desc">${esc(m.description||'')}</p>
   ${m.fileName?`<div class="meta">ファイル: ${esc(m.fileName)}</div>`:''}
   ${m.keywords?`<div class="meta">キーワード: ${esc(m.keywords)}</div>`:''}
  </div>
  ${pv?`<div class="previewbar"><button class="previewbtn" data-p="${esc(m.id)}">プレビューを表示</button><small>iframe preview</small></div>
  <iframe class="preview" data-f="${esc(m.id)}" data-src="${esc(m.previewUrl)}" height="${Number(m.previewHeight||440)}" loading="lazy" allow="fullscreen"></iframe>`:''}
  <div class="foot"><div class="counts"><span>閲覧 ${num(s.views)}</span><span>DL ${num(s.downloads)}</span></div>
  ${m.actionUrl?`<a class="btn" data-a="${esc(m.id)}" href="${esc(m.actionUrl)}" target="_blank" rel="noopener">${esc(m.actionLabel||'開く')}</a>`:''}</div></article>`;
 }).join('');
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.p,f=document.querySelector(`[data-f="${CSS.escape(id)}"]`),m=state.materials.find(x=>x.id===id);
  const open=!f.classList.contains('open');if(open){if(!f.src)f.src=f.dataset.src;f.classList.add('open');b.textContent='プレビューを閉じる';
   const k='preview:'+id;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');logEvent('preview_open',m)}
  }else{f.classList.remove('open');b.textContent='プレビューを表示'}
 });
 document.querySelectorAll('[data-a]').forEach(a=>a.onclick=()=>{const m=state.materials.find(x=>x.id===a.dataset.a);logEvent(m.actionMode==='download'?'download':'open',m)});
 observe();
}
let obs;
function observe(){
 if(!('IntersectionObserver'in window))return;if(obs)obs.disconnect();
 obs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting||e.intersectionRatio<.5)return;const id=e.target.dataset.id,m=state.materials.find(x=>x.id===id),k='view:'+id;
 if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');logEvent('material_view',m)}obs.unobserve(e.target)}),{threshold:[.5]});
 document.querySelectorAll('.card[data-id]').forEach(x=>obs.observe(x));
}
function load(){
 if(!configured()){grid.innerHTML='<div class="error">GAS WebアプリURLが未設定です。index.html の GAS_WEB_APP_URL を設定してください。</div>';apply();return}
 const cb='ssh_'+Date.now()+'_'+Math.floor(Math.random()*1e5),s=document.createElement('script');
 window[cb]=p=>{if(p&&p.ok===false){grid.innerHTML='<div class="error">GASエラー: '+esc(p.error||'不明なエラー')+'</div>';delete window[cb];s.remove();return}state.materials=p.materials||[];state.stats=p.stats||state.stats;state.settings=p.settings||{};apply();types();render();delete window[cb];s.remove()};
 s.onerror=()=>{grid.innerHTML='<div class="error">GASから資料情報を取得できません。</div>';delete window[cb];s.remove()};
 s.src=`${GAS_WEB_APP_URL}?mode=public_data&callback=${cb}&_=${Date.now()}`;document.head.appendChild(s);
}
q.oninput=e=>{state.q=e.target.value;render()};type.onchange=e=>{state.type=e.target.value;render()};
apply();logEvent('page_view',null);load();
</script>
</body></html>
